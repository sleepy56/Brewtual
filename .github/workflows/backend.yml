name: Backend checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pair_app
          POSTGRES_PASSWORD: pair_app_test
          POSTGRES_DB: pair_habits
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pair_app -d pair_habits"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pair_app:pair_app_test@localhost:5432/pair_habits?schema=public
      DATABASE_URL_UNPOOLED: postgresql://pair_app:pair_app_test@localhost:5432/pair_habits?schema=public
      TEST_DATABASE_URL: postgresql://pair_app:pair_app_test@localhost:5432/pair_habits?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
