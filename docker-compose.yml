name: pair-habits

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pair_habits}
      POSTGRES_USER: ${POSTGRES_USER:-pair_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pair_app_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pair-habits-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pair-habits-postgres-data:
